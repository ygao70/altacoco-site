  if (tab) { if (tab.dataset.tab === 'packages' && S.tab === 'packages') S.detail = null; showTab(tab.dataset.tab); return; }
  const c = e.target.closest('[data-cmd]');
  if (c) { onScan(c.dataset.cmd); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { setTimeout(refocus, 0); return; }
  const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case 'type':
      showModal({tone: 'info', title: 'Type a code',
        body: `<p class="note">Enter what the scanner would have read (tracking, ASIN, serial, or a CMD: code).</p>`,
        input: {placeholder: S.state === 'WAITING_FOR_TRACKING' ? 'Tracking number' : S.state === 'WAITING_FOR_ASIN' ? 'ASIN' : 'Serial number', submit: v => onScan(v)},
        buttons: [{label: 'Submit', cls: 'primary', fn: v => processScan(v)}, {label: 'Cancel', cls: 'ghost'}]});
      break;
    case 'addmore': S.state = S.pendingAsin ? 'WAITING_FOR_SERIAL' : 'WAITING_FOR_ASIN'; renderScan(); break;
    case 'del': enqueue(() => deleteItem(id)); break;
    case 'open-pkg': S.detail = id; showTab('packages'); break;
    case 'back': S.detail = null; renderPackages(); break;
    case 'resume': enqueue(() => resumePackage(id)); break;
    case 'filter': S.pf = a.dataset.f; renderPackages(); break;
    case 'print': buildPrintSheet(); window.print(); break;
    case 'export-csv': enqueue(exportCSV); break;
    case 'export-json': enqueue(exportJSON); break;
    case 'import-json': $('#import-file').click(); break;
    case 'clear-all': eraseAll(); break;
    case 'cloud-signin': {
      const em = ($('#cloud-email') || {}).value || '', pw = ($('#cloud-pass') || {}).value || '';
      const out = $('#cloud-err');
      if (!em || !pw) { if (out) out.textContent = 'Enter email and password.'; break; }
      a.disabled = true; a.textContent = 'Signing in…';
      Cloud.signIn(em, pw).then(() => { document.activeElement && document.activeElement.blur(); renderSettings(); })
        .catch(err => { a.disabled = false; a.textContent = 'Sign in'; if ($('#cloud-err')) $('#cloud-err').textContent = authMessage(err); });
      break;
    }
    case 'cloud-reset': {
      const em = ($('#cloud-email') || {}).value || '';
      if (!em) { if ($('#cloud-err')) $('#cloud-err').textContent = 'Type your email first, then tap “Forgot password?”.'; break; }
      Cloud.resetPassword(em).then(() => { if ($('#cloud-err')) $('#cloud-err').textContent = 'Password reset email sent.'; })
        .catch(err => { if ($('#cloud-err')) $('#cloud-err').textContent = authMessage(err); });
      break;
    }
    case 'cloud-sync': Cloud.sync({pull: true}).then(renderSettings); break;
    case 'cloud-signout':
      showModal({tone: 'info', title: 'Sign out of cloud sync?',
        body: `<p>Scans stay on this phone and keep working offline.${Cloud.pending ? ` <b>${Cloud.pending} change(s)</b> will upload after you sign in again.` : ''}</p>`,
        buttons: [{label: 'Sign out', cls: 'primary', fn: async () => { await Cloud.signOut(); renderSettings(); }}, {label: 'Cancel', cls: 'ghost'}]});
      break;
  }
});
document.addEventListener('change', e => {
  const p = e.target.closest('[data-pref]');
  if (p) { prefs[p.dataset.pref] = p.checked; savePrefs(); }
});
$('#import-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  enqueue(async () => {
    try {
      const r = await importJSON(f);
      showModal({tone: 'info', title: 'Backup restored',
        body: `<p>${plural(r.np, 'package')} and ${plural(r.ni, 'item')} added or updated.</p>${r.skipped ? `<p class="note">${plural(r.skipped, 'entry')} skipped (already removed here, duplicate serial, or invalid).</p>` : ''}`,
        buttons: [{label: 'OK', cls: 'primary', fn: renderSettings}]});
    } catch (err) { showModal({tone: 'err', title: 'Could not restore', body: `<p>${esc(err.message || err)}</p>`, buttons: [{label: 'OK', cls: 'primary'}]}); }
  });
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.keyCode === 13) && e.target && (e.target.id === 'cloud-pass' || e.target.id === 'cloud-email')) {
    e.preventDefault(); const b = $('[data-act="cloud-signin"]'); if (b) b.click();
  }
});
$('#search-form').addEventListener('submit', e => { e.preventDefault(); $('#q').blur(); doSearch(); });
let sT = null;
$('#q').addEventListener('input', () => { clearTimeout(sT); sT = setTimeout(doSearch, 250); });

$('#gate-btn').addEventListener('click', () => { hideGate(); refocus(); });

/* ---------------- boot ---------------- */
(async () => {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (!('indexedDB' in window)) { $('#v-scan').innerHTML = '<p class="empty">This browser cannot store data (private mode?). Open in normal Safari.</p>'; return; }
  // Restore through the scan queue so a scan that arrives during start-up waits for the open package.
  await enqueue(async () => { await restoreSession(); renderScan(); await refreshCounts(); });
  Cloud.refreshPending();
  Cloud.load().catch(() => {});   // loads Firebase in the background; scanning never waits for it
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/trade/sw.js', {scope: '/trade/'}).catch(() => {});
  // test hook (harmless in production)
  window.__scanStation = {S, onScan, DB, code128svg, exportCSV, exportJSON, importJSON, Cloud};
})();
})();
</script>
</body>
